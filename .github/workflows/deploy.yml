name: Deploy GenKey Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode full Worker source
        run: |
          set -e
          if [ -d src/b64parts ] && ls src/b64parts/*.b64 >/dev/null 2>&1; then
            cat $(ls src/b64parts/*.b64 | sort) | base64 -d > src/index.js
            echo "Decoded src/index.js ($(wc -c < src/index.js) bytes)"
            head -5 src/index.js
            grep -q generateRegistrationOptions src/index.js && echo "WebAuthn OK"
            grep -q DEMO_HTML src/index.js && echo "UI embedded OK"
          else
            echo "Using existing src/index.js"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
