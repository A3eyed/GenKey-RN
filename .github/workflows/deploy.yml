name: Deploy GenKey Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Worker source
        run: |
          set -e
          if [ -f src/index.js ] && [ $(wc -c < src/index.js) -gt 10000 ] && grep -q generateRegistrationOptions src/index.js; then
            echo "Using committed src/index.js ($(wc -c < src/index.js) bytes)"
          elif [ -d src/b64parts ] && ls src/b64parts/*.b64 >/dev/null 2>&1; then
            cat $(ls src/b64parts/*.b64 | sort) | base64 -d > src/index.js
            echo "Decoded from b64 ($(wc -c < src/index.js) bytes)"
          else
            echo "ERROR: no Worker source"
            exit 1
          fi
          # Validate completeness
          if ! grep -q 'export default' src/index.js; then
            echo "ERROR: missing export default - truncated source"
            tail -5 src/index.js
            exit 1
          fi
          if ! tail -c 20 src/index.js | grep -q '}'; then
            echo "ERROR: file does not end properly - truncated"
            tail -5 src/index.js
            exit 1
          fi
          head -6 src/index.js
          grep -q DEMO_HTML src/index.js && echo "UI: OK"
          grep -q generateRegistrationOptions src/index.js && echo "WebAuthn: OK"
          grep -q replaceAll src/index.js && echo "replaceAll fix: OK"
          wc -l src/index.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
