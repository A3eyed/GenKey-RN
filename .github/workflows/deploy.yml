name: Deploy GenKey Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble full Worker from parts
        run: |
          if [ -d src/parts ] && ls src/parts/*.part >/dev/null 2>&1; then
            cat src/parts/*.part > src/index.js
            echo "Assembled src/index.js ($(wc -c < src/index.js) bytes)"
            head -5 src/index.js
          else
            echo "No parts found, using existing src/index.js"
          fi
          grep -q generateRegistrationOptions src/index.js && echo "WebAuthn imports OK" || echo "WARNING: missing WebAuthn imports"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
